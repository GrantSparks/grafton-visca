[package]
name = "synemantic-2-0-fixture"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
grafton-visca = { path = "../../..", default-features = false, features = [
    "runtime-tokio",
    "dyn-api",
    "serde",
    "schemars",
    "ts-rs",
] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
ts-rs = "12"

[workspace]
