[package]
name = "phase4-renamed-dependency"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Exercises the optional derive implementations emitted by `visca_range_type!`
# without making this base renamed-dependency fixture pull helper crates.
range-helper-derives = [
    "visca_renamed/serde",
    "visca_renamed/schemars",
    "visca_renamed/ts-rs",
    "dep:serde_json",
]

[dependencies]
derive_shadows = { package = "phase4-derive-shadows", path = "../phase4_derive_shadows" }
serde_json = { version = "1.0", optional = true }
visca_renamed = { package = "grafton-visca", path = "../../..", version = "=2.0.0-rc.2", default-features = false }
