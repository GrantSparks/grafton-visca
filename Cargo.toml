[workspace]
members = [
    ".",
    "grafton-visca-macros",
    "tests/fixtures/phase4_derive_shadows",
    "tests/fixtures/phase4_renamed",
]

[workspace.package]
version = "2.0.0-rc.1"
authors = ["Grant Sparks <grant@grafton.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-visca"
homepage = "https://www.grafton.ai"
edition = "2021"
rust-version = "1.88"

[package]
name = "grafton-visca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust based VISCA over IP implementation for controlling PTZ Cameras"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["multimedia"]
keywords = ["ptz", "camera", "visca", "video"]
# What the published tarball carries is a deliberate set, not a default.
# `README.md`, `LICENSE-MIT`, `LICENSE-APACHE`, `docs/`, `examples/`, `src/`
# and `tests/` are for consumers. `CHANGELOG.md` and `CONTRIBUTING.md` are
# kept on purpose: the changelog is the upgrade record a consumer reads
# offline from a vendored crate, and CONTRIBUTING documents the feature matrix
# and toolchain pins a downstream debugger needs. Everything below is
# repository or CI machinery with no consumer value.
exclude = [
    "target/",
    # CI-only public API baselines. They are large, regenerated by contributors,
    # and of no use to consumers of the published crate.
    "api/",
    ".gitignore",
    ".github/",
    ".vscode/",
    ".claude/",
    ".git-hooks/",
    ".pre-commit-config.yaml",
    # `cargo-deny` configuration: CI-only, in the same class as `api/`.
    "deny.toml",
    "RELEASING.md",
    "all_source.txt",
]
readme = "README.md"

[features]
# The owner-backed blocking facade is the default. Async is independently
# selectable, so applications may opt into either facade or both together.
#
# TCP and UDP are not features: the standard IP transports are built from `std`
# and the runtime adapters, so they compile with whichever facade is enabled and
# have nothing to gate.
default = ["blocking"]
blocking = []
# Runtime-agnostic async support. Runtime features add their adapter while
# applications may also enable the independent blocking facade.
#
# `async-executor` is pulled here rather than by `test-utils`: the only code
# that uses it is the async testkit's deterministic executor, which compiles
# only under `async` + `test-utils`. Riding it on `async` keeps a blocking-only
# consumer that enables `test-utils` free of any executor, which the
# dependency-boundary gate enforces (`blocking,test-utils` must stay clean).
async = ["dep:futures-lite", "dep:async-lock", "dep:async-executor"]

# Runtime features imply the canonical async facade.
runtime-tokio = ["async", "dep:tokio"]
runtime-smol = ["async", "dep:smol", "dep:async-executor", "dep:async-io"]

# Transport features
transport-serial = ["blocking", "dep:serialport"]
transport-serial-tokio = ["dep:tokio-serial", "runtime-tokio"]

# Serialization features
serde = ["dep:serde", "dep:serde_json"]
schemars = ["serde", "dep:schemars"]
ts-rs = ["serde", "dep:ts-rs"]

# Runtime-profile camera projections. The blocking projection is native and
# adds no executor or futures dependency; enabling `async` additionally exposes
# the object-safe async noun/custom-operation surface.
dyn-api = []

# Internal features
#
# Build-time marker for the deterministic and scripted-transport testkits used
# by this crate and by downstream test suites. It deliberately links no async
# runtime or executor: the blocking testkit (`ScriptedBlockingTransport`,
# `Step`, `helpers`) is available under `blocking,test-utils` with a native
# synchronous graph, while the async testkit (`DeterministicExecutor`, the async
# `ScriptedTransport`) and its `async-executor`/`futures-lite` dependencies are
# compiled and pulled only when `async` is also enabled.
test-utils = []

[dependencies]
bytes = "1.11"
flume = "0.12"
smallvec = "1.15"
grafton-visca-macros = { path = "grafton-visca-macros", version = "=2.0.0-rc.1" }
tracing = "0.1"
nom = "8.0.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
schemars = { version = "1.2", optional = true }
# Keep ts-rs' default `serde-compat` support for the serde attributes it understands.
# The value wrappers also use serde's `try_from`/`into` validation controls, which
# ts-rs v12 intentionally ignores; `no-serde-warnings` suppresses unsupported-
# attribute diagnostics without disabling `serde-compat`.
ts-rs = { version = "12", features = ["format", "no-serde-warnings"], optional = true }
serialport = { version = "4.9", optional = true }
tokio-serial = { version = "5.4", optional = true }
thiserror = "2.0"
tokio = { version = "1.52", features = [
    "net",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
], optional = true }
async-executor = { version = "1.14.0", optional = true }
futures-lite = { version = "2.6", optional = true }
smol = { version = "2.0", optional = true }
async-lock = { version = "3.4", optional = true }
async-io = { version = "2.6", optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
# OS socket option support for TCP keepalive, TTL, and TCP_NODELAY.
socket2 = "0.6"

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
async-io = "2.6"
async-executor = "1.14"
futures-lite = "2.6"
pollster = "0.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
proptest = "1.11.0"

