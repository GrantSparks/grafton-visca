[workspace]
members = [".", "grafton-visca-macros"]

[workspace.package]
version = "0.7.0"
authors = ["Grant Sparks <grant@grafton.ai>"]
license = "Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-visca"
homepage = "https://www.grafton.ai"
edition = "2021"
rust-version = "1.80"

[package]
name = "grafton-visca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust based VISCA over IP implementation for controlling PTZ Cameras"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["multimedia"]
keywords = ["ptz", "camera", "visca", "video"]
exclude = ["target/", ".gitignore", ".github/", ".vscode/"]
readme = "README.md"

[features]
default = []
async = ["dep:futures-lite"]
rt-tokio = ["async", "dep:tokio"]
rt-async-std = ["async", "dep:async-std"]
rt-smol = ["async", "dep:smol", "dep:async-executor"]
serial = ["dep:serialport"]
test-utils = ["dep:async-executor", "dep:futures-lite"]  # Feature for exposing test utilities

[dependencies]
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
flume = "0.11"
grafton-visca-macros = { path = "grafton-visca-macros", version = "0.7.0" }
hex = "0.4"
log = "0.4.22"
env_logger = "0.11.5"
nom = "8.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.5", optional = true }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.47", features = [
    "net",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
], optional = true }
async-executor = { version = "1.8", optional = true }
futures-lite = { version = "2.3", optional = true }
async-std = { version = "1.12", features = ["unstable"], optional = true }
smol = { version = "2.0", optional = true }

[dev-dependencies]
tokio = { version = "1.47", features = ["full", "test-util"] }
trybuild = "1.0"
async-io = "2.3"
async-executor = "1.8"
async-trait = "0.1"
futures-lite = "2.3"
rand = "0.9"

# Consolidated examples - clean, focused learning experience

[[example]]
name = "quickstart"
# Basic blocking example - no features required

[[example]]
name = "quickstart_async"
required-features = ["rt-tokio"]

[[example]]
name = "transports"
# Transport comparison - no features required for blocking

[[example]]
name = "builder_api"
required-features = ["rt-tokio"]

[[example]]
name = "camera_inquiry"
required-features = ["rt-tokio"]

[[example]]
name = "concurrent_control"
required-features = ["rt-tokio"]

[[example]]
name = "error_handling"
required-features = ["rt-tokio"]

[[example]]
name = "preset_demo"
# Preset management - no features required

[[example]]
name = "type_safe_commands"
# Type-safe command builder demonstration - no features required

[[example]]
name = "runtime_agnostic"
required-features = ["async"]

[[example]]
name = "sony_encapsulation"
required-features = ["rt-tokio"]

[[example]]
name = "inquiry_demo"
required-features = ["rt-tokio"]
