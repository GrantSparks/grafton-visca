[workspace]
members = [".", "grafton-visca-macros"]

[workspace.package]
version = "0.7.0"
authors = ["Grant Sparks <grant@grafton.ai>"]
license = "Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-visca"
homepage = "https://www.grafton.ai"
edition = "2021"
rust-version = "1.80"

[package]
name = "grafton-visca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust based VISCA over IP implementation for controlling PTZ Cameras"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["multimedia"]
keywords = ["ptz", "camera", "visca", "video"]
exclude = ["target/", ".gitignore", ".github/", ".vscode/"]
readme = "README.md"

[features]
default = []
async = ["dep:futures"]
tokio = ["async", "dep:tokio"]

[dependencies]
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
futures = { version = "0.3", optional = true }
grafton-visca-macros = { version = "0.7.0", path = "grafton-visca-macros" }
log = "0.4.22"
env_logger = "0.11.5"
nom = "7.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = [
    "net",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
], optional = true }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
trybuild = "1.0"

# Consolidated examples - clean, focused learning experience

[[example]]
name = "quickstart"
# Basic blocking example - no features required

[[example]]
name = "quickstart_async"
required-features = ["tokio"]

[[example]]
name = "transports"
# Transport comparison - no features required for blocking

[[example]]
name = "builder_api"
# Builder patterns - no features required for blocking

[[example]]
name = "camera_inquiry"
required-features = ["tokio"]

[[example]]
name = "concurrent_control"
required-features = ["tokio"]

[[example]]
name = "error_handling"
# Error handling patterns - no features required

[[example]]
name = "preset_demo"
# Preset management - no features required

[[example]]
name = "type_safe_commands"
# Type-safe command builder demonstration - no features required
