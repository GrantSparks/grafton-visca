[workspace]
members = [".", "grafton-visca-macros"]

[workspace.package]
version = "0.7.0"
authors = ["Grant Sparks <grant@grafton.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-visca"
homepage = "https://www.grafton.ai"
edition = "2021"
rust-version = "1.80"

[package]
name = "grafton-visca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust based VISCA over IP implementation for controlling PTZ Cameras"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["multimedia"]
keywords = ["ptz", "camera", "visca", "video"]
exclude = ["target/", ".gitignore", ".github/", ".vscode/"]
readme = "README.md"

[features]
default = []
async = ["dep:futures-lite", "dep:async-lock"]
rt-tokio = ["async", "dep:tokio"]
rt-async-std = ["async", "dep:async-std"]
rt-smol = ["async", "dep:smol", "dep:async-executor"]
tokio-serial = ["dep:tokio-serial", "rt-tokio"]
serialport = ["dep:serialport"]
test-utils = ["dep:async-executor", "dep:futures-lite"]
DISABLED = []

[dependencies]
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
flume = "0.11"
grafton-visca-macros = { path = "grafton-visca-macros", version = "0.7.0" }
hex = "0.4"
tracing = "0.1"
nom = "8.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
serialport = { version = "4.7.3", optional = true }
tokio-serial = { version = "5.4", optional = true }
thiserror = "2.0.16"
tokio = { version = "1.47", features = [
    "net",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
], optional = true }
async-executor = { version = "1.13.3", optional = true }
futures-lite = { version = "2.3", optional = true }
pollster = "0.3"
async-std = { version = "1.12", features = ["unstable", "attributes"], optional = true }
smol = { version = "2.0", optional = true }
async-lock = { version = "3.0", optional = true }

[dev-dependencies]
tokio = { version = "1.47", features = ["full", "test-util"] }
trybuild = "1.0"
async-io = "2.3"
async-executor = "1.8"
futures-lite = "2.3"
rand = "0.9"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[[example]]
name = "quickstart"

[[example]]
name = "quickstart_async"

[[example]]
name = "transports"
path = "examples-advanced/transports.rs"

[[example]]
name = "builder_api"

[[example]]
name = "inquiry_quickstart"

[[example]]
name = "concurrent_control"
required-features = ["rt-tokio"]

[[example]]
name = "error_handling"
required-features = ["rt-tokio"]

[[example]]
name = "preset_demo"

[[example]]
name = "type_safe_commands"
path = "examples-advanced/type_safe_commands.rs"

[[example]]
name = "runtime_demo_lowlevel"
path = "examples-advanced/runtime_demo_lowlevel.rs"
required-features = ["async", "rt-tokio"]

[[example]]
name = "runtime_agnostic"
required-features = ["async"]

[[example]]
name = "sony_encapsulation"
required-features = ["rt-tokio"]

[[example]]
name = "protocol_auto_detection"
required-features = ["rt-tokio"]

[[example]]
name = "serial_async_demo"
required-features = ["rt-tokio", "tokio-serial"]
