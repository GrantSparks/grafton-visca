[workspace]
members = [".", "grafton-visca-macros"]

[workspace.package]
version = "0.13.0"
authors = ["Grant Sparks <grant@grafton.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-visca"
homepage = "https://www.grafton.ai"
edition = "2021"
rust-version = "1.88"

[package]
name = "grafton-visca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust based VISCA over IP implementation for controlling PTZ Cameras"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["multimedia"]
keywords = ["ptz", "camera", "visca", "video"]
exclude = ["target/", ".gitignore", ".github/", ".vscode/", "all_source.txt"]
readme = "README.md"

[features]
default = []
# Mode selection: enable mode-async for async API, omit it for blocking API.
# The blocking API is the default when mode-async is not enabled.
mode-async = ["dep:futures-lite", "dep:async-lock"]

# Runtime features and compatibility aliases (each implies mode-async)
runtime-tokio = ["mode-async", "dep:tokio"]
runtime-smol = ["mode-async", "dep:smol", "dep:async-executor", "dep:async-io"]

# Transport features
transport-serial = ["dep:serialport"]
transport-serial-tokio = ["dep:tokio-serial", "runtime-tokio"]

# Serialization features
serde = ["dep:serde", "dep:serde_json", "dep:serde_with"]
schemars = ["serde", "dep:schemars"]
ts-rs = ["serde", "dep:ts-rs"]

# Dynamic trait object API with per-operation timeout support
dyn-api = ["mode-async"]

# Internal features
test-utils = ["dep:async-executor", "dep:futures-lite"]
DISABLED = []

[dependencies]
bytes = "1.11"
flume = "0.12"
smallvec = "1.15"
grafton-visca-macros = { path = "grafton-visca-macros", version = "0.13.0" }
tracing = "0.1"
nom = "8.0.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
schemars = { version = "1.2", optional = true }
ts-rs = { version = "12", features = ["format"], optional = true }
serde_with = { version = "3.20", features = ["macros"], optional = true }
serialport = { version = "4.9", optional = true }
tokio-serial = { version = "5.4", optional = true }
thiserror = "2.0"
tokio = { version = "1.52", features = [
    "net",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
], optional = true }
async-executor = { version = "1.14.0", optional = true }
futures-lite = { version = "2.6", optional = true }
pollster = "0.4"
smol = { version = "2.0", optional = true }
async-lock = { version = "3.4", optional = true }
async-io = { version = "2.6", optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
# OS socket option support for TCP keepalive, TTL, and TCP_NODELAY.
socket2 = "0.6"

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
trybuild = "1.0"
async-io = "2.6"
async-executor = "1.14"
futures-lite = "2.6"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

