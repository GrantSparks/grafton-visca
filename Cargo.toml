[workspace]
members = [".", "grafton-visca-macros"]

[workspace.package]
version = "0.9.0"
authors = ["Grant Sparks <grant@grafton.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-visca"
homepage = "https://www.grafton.ai"
edition = "2021"
rust-version = "1.80"

[package]
name = "grafton-visca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust based VISCA over IP implementation for controlling PTZ Cameras"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["multimedia"]
keywords = ["ptz", "camera", "visca", "video"]
exclude = ["target/", ".gitignore", ".github/", ".vscode/"]
readme = "README.md"

[features]
default = []
# Mode features (not mutually exclusive)
mode-async = ["dep:futures-lite", "dep:async-lock"]
mode-blocking = []  # Blocking mode is always available, this is for explicit feature detection

# Runtime features (each implies mode-async)
runtime-tokio = ["mode-async", "dep:tokio"]
runtime-async-std = ["mode-async", "dep:async-std"]
runtime-smol = ["mode-async", "dep:smol", "dep:async-executor", "dep:async-io"]

# Transport features
transport-serial = ["dep:serialport"]
transport-serial-tokio = ["dep:tokio-serial", "runtime-tokio"]

# Serialization features
serde = ["dep:serde", "dep:serde_json", "dep:serde_with"]
schemars = ["serde", "dep:schemars"]

# Internal features
test-utils = ["dep:async-executor", "dep:futures-lite"]
DISABLED = []

[dependencies]
bytes = "1.5"
chrono = { version = "0.4" }
flume = "0.11"
smallvec = "1.13"
grafton-visca-macros = { path = "grafton-visca-macros", version = "0.9.0" }
hex = "0.4"
tracing = "0.1"
nom = "8.0.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0.143", optional = true }
schemars = { version = "1.1", optional = true }
serde_with = { version = "3.16", features = ["macros"], optional = true }
serialport = { version = "4.8", optional = true }
tokio-serial = { version = "5.4", optional = true }
thiserror = "2.0"
tokio = { version = "1.48", features = [
    "net",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
], optional = true }
async-executor = { version = "1.13.3", optional = true }
futures-lite = { version = "2.6", optional = true }
pollster = "0.4"
async-std = { version = "1.13", features = ["unstable", "attributes"], optional = true }
smol = { version = "2.0", optional = true }
async-lock = { version = "3.4", optional = true }
async-io = { version = "2.6", optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["full", "test-util"] }
trybuild = "1.0"
async-io = "2.6"
async-executor = "1.8"
futures-lite = "2.6"
rand = "0.9"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[[example]]
name = "quickstart"

[[example]]
name = "quickstart_async"

[[example]]
name = "transports"
path = "examples-advanced/transports.rs"

[[example]]
name = "builder_api"
path = "examples-advanced/builder_api.rs"

[[example]]
name = "inquiry_quickstart"

[[example]]
name = "concurrent_control"
required-features = ["runtime-tokio"]

[[example]]
name = "error_handling"
path = "examples-advanced/error_handling.rs"
required-features = ["runtime-tokio"]

[[example]]
name = "preset_demo"

[[example]]
name = "type_safe_commands"
path = "examples-advanced/type_safe_commands.rs"

[[example]]
name = "runtime_demo_lowlevel"
path = "examples-advanced/runtime_demo_lowlevel.rs"
required-features = ["mode-async", "runtime-tokio"]

[[example]]
name = "runtime_agnostic"
required-features = ["mode-async"]

[[example]]
name = "sony_encapsulation"
path = "examples-advanced/sony_encapsulation.rs"
required-features = ["runtime-tokio"]


[[example]]
name = "serial_async_demo"
required-features = ["runtime-tokio", "transport-serial-tokio"]
