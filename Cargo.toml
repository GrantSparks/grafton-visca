[workspace]
members = [".", "grafton-visca-macros"]

[package]
name = "grafton-visca"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
authors = ["Grant Sparks <grant@grafton.ai>"]
description = "Rust based VISCA over IP implementation for controlling PTZ Cameras"
license = "Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-visca"
homepage = "https://www.grafton.ai"
categories = ["multimedia"]
keywords = ["ptz", "camera", "visca", "video"]
exclude = ["target/", ".gitignore", ".github/", ".vscode/"]
readme = "README.md"

[features]
default = []
async = ["futures", "futures-util"]
tokio = ["async", "dep:tokio"]

[dependencies]
grafton-visca-macros = { version = "0.4.0", path = "grafton-visca-macros" }
log = "0.4.22"
env_logger = "0.11.5"
nom = "7.1.3"
thiserror = "1.0"
paste = "1.0"
parking_lot = { version = "0.12" }
tokio = { version = "1.38", features = ["net", "sync", "time", "rt", "rt-multi-thread", "macros", "io-util"], optional = true }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }


[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
tokio-test = "0.4"

