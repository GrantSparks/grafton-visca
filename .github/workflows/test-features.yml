name: Reusable Feature Test Workflow

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: 'Operating system to run tests on'
      rust:
        required: true
        type: string
        description: 'Rust toolchain version'
      features:
        required: true
        type: string
        description: 'Feature set to test (minimal, full, or specific features)'
      runs-on:
        required: true
        type: string
        description: 'Runner to use'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Features
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Install system dependencies
      - name: Install system dependencies
        if: inputs.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust ${{ inputs.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust }}
          components: clippy

      # Setup sccache for compiler caching (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # Enhanced caching
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ inputs.os }}-${{ inputs.rust }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true
          cache-on-failure: true
          cache-all-crates: true

      # Cache cargo registry index
      - name: Cache cargo registry index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ inputs.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-index-${{ inputs.os }}-
            cargo-index-

      # Run tests based on feature set
      - name: Run tests for ${{ inputs.features }}
        run: |
          case "${{ inputs.features }}" in
            "minimal")
              echo "Running minimal test suite..."
              # Test key configurations for feature branches
              cargo test --no-default-features --verbose
              cargo test --no-default-features --features mode-blocking --verbose
              cargo test --no-default-features --features mode-async --verbose
              cargo test --no-default-features --features runtime-tokio --verbose
              cargo test --no-default-features --features test-utils --verbose
              cargo test --no-default-features --features runtime-tokio,test-utils --verbose
              cargo test --no-default-features --features runtime-tokio,transport-serial --verbose
              cargo test --no-default-features --features runtime-tokio,transport-serial-tokio --verbose
              ;;

            "full")
              echo "Running full test suite..."
              # Test all feature combinations
              cargo test --verbose
              cargo test --no-default-features --verbose
              cargo test --no-default-features --features mode-blocking --verbose
              cargo test --no-default-features --features mode-async --verbose
              cargo test --no-default-features --features runtime-tokio --verbose
              cargo test --no-default-features --features runtime-smol --verbose
              cargo test --no-default-features --features test-utils --verbose
              cargo test --no-default-features --features runtime-tokio,test-utils --verbose
              cargo test --no-default-features --features runtime-smol,test-utils --verbose
              cargo test --no-default-features --features transport-serial --verbose
              cargo test --no-default-features --features runtime-tokio,transport-serial --verbose
              cargo test --no-default-features --features runtime-tokio,transport-serial-tokio --verbose
              cargo test --no-default-features --features serde,schemars,ts-rs --verbose
              cargo test --no-default-features --features runtime-tokio,dyn-api,test-utils --test dyn_api_integration_test --verbose
              cargo test --no-default-features --features runtime-smol,dyn-api --verbose
              cargo test --no-default-features --features runtime-smol,dyn-api,test-utils --test dyn_api_smol_integration_test --verbose
              cargo test -p grafton-visca-macros --verbose
              ;;

            *)
              echo "Testing specific features: ${{ inputs.features }}"
              if [ -z "${{ inputs.features }}" ]; then
                cargo test --no-default-features --verbose
              else
                cargo test --no-default-features --features "${{ inputs.features }}" --verbose
              fi
              ;;
          esac
        env:
          TMPDIR: ${{ runner.temp }}

      # Run clippy for the feature set
      - name: Run clippy for ${{ inputs.features }}
        run: |
          case "${{ inputs.features }}" in
            "minimal"|"full")
              # Already covered in test phase
              echo "Clippy checks included in test phase"
              ;;

            *)
              if [ -z "${{ inputs.features }}" ]; then
                cargo clippy --all-targets --no-default-features -- -D warnings
              else
                cargo clippy --all-targets --no-default-features --features "${{ inputs.features }}" -- -D warnings
              fi
              ;;
          esac

      # Build examples if on stable
      - name: Build examples
        if: inputs.rust == 'stable'
        run: |
          case "${{ inputs.features }}" in
            "minimal")
              cargo build --examples --no-default-features --features runtime-tokio
              ;;

            "full")
              cargo build --examples --no-default-features
              cargo build --examples --no-default-features --features mode-async
              cargo build --examples --no-default-features --features runtime-tokio
              ;;

            *)
              # Skip example building for specific feature testing
              echo "Skipping example building for feature-specific tests"
              ;;
          esac
