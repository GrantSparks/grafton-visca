name: Reusable 2.0 feature checks

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        default: ubuntu-latest
        type: string
      rust:
        required: false
        default: stable
        type: string
      features:
        required: true
        type: string
        description: Feature set, or minimal/full for the canonical matrix

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: ${{ inputs.features }} (${{ inputs.rust }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install serial transport dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev

      - name: Install Rust ${{ inputs.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: reusable-${{ inputs.runs-on }}-${{ inputs.rust }}-${{ inputs.features }}

      - name: Reject removed feature names
        shell: bash
        run: |
          set -euo pipefail
          for feature in mode-async async-core mode-blocking; do
            output_file="${RUNNER_TEMP}/removed-${feature}.log"
            if cargo check --no-default-features --features "${feature}" >"${output_file}" 2>&1; then
              cat "${output_file}"
              echo "::error::removed feature ${feature} unexpectedly succeeded"
              exit 1
            fi
            grep -Fq "does not contain this feature: ${feature}" "${output_file}"
          done

      - name: Run requested feature checks
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.features }}" in
            minimal)
              cargo test --no-default-features --lib
              cargo test --no-default-features --features blocking --all-targets
              cargo test --no-default-features --features async --all-targets
              cargo test --no-default-features --features runtime-tokio --all-targets
              cargo test --no-default-features --features runtime-smol --all-targets
              cargo test --no-default-features --features runtime-tokio,runtime-smol --all-targets
              cargo test --no-default-features --features blocking,runtime-tokio,runtime-smol --all-targets
              ;;
            full)
              bash .github/scripts/test-all-features.sh
              ;;
            "")
              cargo test --no-default-features --lib
              ;;
            *)
              cargo test --no-default-features --features "${{ inputs.features }}" --all-targets
              ;;
          esac

      - name: Run strict clippy
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.features }}" in
            full)
              cargo clippy --workspace --all-targets --all-features -- -D warnings
              ;;
            minimal)
              cargo clippy --lib --no-default-features -- -D warnings
              ;;
            "")
              cargo clippy --lib --no-default-features -- -D warnings
              ;;
            *)
              cargo clippy --all-targets --no-default-features \
                --features "${{ inputs.features }}" -- -D warnings
              ;;
          esac

      - name: Check examples on stable
        if: inputs.rust == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.features }}" in
            minimal|full)
              cargo check --examples --no-default-features --features blocking
              cargo check --examples --no-default-features --features runtime-tokio
              cargo check --examples --no-default-features --features runtime-smol
              cargo check --examples --all-features
              ;;
            *)
              echo "Examples are covered by the canonical full matrix."
              ;;
          esac
