name: Rust CI/CD

# Comprehensive CI/CD pipeline with enhanced feature coverage
#
# Key improvements:
# - Parallel feature matrix testing for better performance
# - Enhanced dependency caching with sccache and registry index
# - Miri safety checks for unsafe code
# - Cross-compilation testing
# - Reusable workflows for better organization
# - Job timeouts for reliability
# - Comprehensive 1.0 support-matrix testing (matches README and contributor docs)
# - Tests blocking, async runtimes, serial transports, dyn-api, and serialization features
# - Enhanced clippy coverage for all feature combinations
# - Platform matrix testing (ubuntu, windows, macos) × (stable, beta)
# - Separate minimal testing for feature branches (faster feedback)
# - Full testing on main/PRs (comprehensive quality assurance)

on:
  push:
    branches: ["main", "feature/*"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # Quick format check (no dependencies needed)
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
        continue-on-error: true

      # macOS runners have intermittently left `cargo` resolving to
      # `rustup-init` after the install action reported success, so verify the
      # toolchain is actually usable and fall back to a direct rustup install.
      - name: Ensure nightly toolchain is usable
        shell: bash
        run: |
          if rustup component list --toolchain nightly --installed 2>/dev/null | grep -q '^rustfmt' \
            && cargo +nightly --version >/dev/null 2>&1; then
            cargo +nightly --version
            exit 0
          fi
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install nightly --component rustfmt --profile minimal && break
            sleep 30
          done
          cargo +nightly --version

      - run: cargo +nightly fmt --all -- --check

  # Test on minimal platform for feature branches (uses reusable workflow)
  test-minimal:
    name: Test Minimal
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/test-features.yml
    with:
      os: ubuntu-latest
      rust: stable
      features: "minimal"
      runs-on: ubuntu-latest

  # Test on Unix platforms (Linux/macOS)
  test-unix:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    # Skip on feature branch pushes (use test-minimal instead)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Install system dependencies for transport-serial
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
        continue-on-error: true

      # macOS runners have intermittently left `cargo` resolving to
      # `rustup-init` after the install action reported success, so verify the
      # toolchain is actually usable and fall back to a direct rustup install.
      - name: Ensure ${{ matrix.rust }} toolchain is usable
        shell: bash
        run: |
          if rustup show active-toolchain 2>/dev/null | grep -q "${{ matrix.rust }}" \
            && cargo +${{ matrix.rust }} --version >/dev/null 2>&1; then
            cargo +${{ matrix.rust }} --version
            exit 0
          fi
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install ${{ matrix.rust }} --profile minimal \
              && rustup default ${{ matrix.rust }} \
              && break
            sleep 30
          done
          cargo +${{ matrix.rust }} --version

      # Setup sccache for compiler caching (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # Compiler/dependency cache. Advisory only: tests must run if cache restore fails.
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-${{ matrix.os }}-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true
          cache-on-failure: true
          cache-all-crates: true

      # Use reusable workflow for comprehensive testing
      - name: Run comprehensive feature tests
        run: |
          echo "Running comprehensive test suite..."
          bash .github/scripts/test-all-features.sh

  # Windows-specific parallel test jobs for better performance
  test-windows:
    name: Test Windows (${{ matrix.rust }} / ${{ matrix.features || 'default' }})
    # Skip on feature branch pushes
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
        features:
          - ""  # default features
          - "no-default"
          - "mode-blocking"
          - "runtime-tokio"
          - "runtime-smol"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
        continue-on-error: true

      # Mirror the Unix job's verify-and-fallback so a silently-unusable
      # toolchain reinstalls before tests run.
      - name: Ensure ${{ matrix.rust }} toolchain is usable
        shell: bash
        run: |
          if rustup show active-toolchain 2>/dev/null | grep -q "${{ matrix.rust }}" \
            && cargo +${{ matrix.rust }} --version >/dev/null 2>&1; then
            cargo +${{ matrix.rust }} --version
            exit 0
          fi
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install ${{ matrix.rust }} --profile minimal \
              && rustup default ${{ matrix.rust }} \
              && break
            sleep 30
          done
          cargo +${{ matrix.rust }} --version

      # Setup sccache for compiler caching (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # Normalize the empty default feature entry before it reaches cache keys.
      - name: Sanitize features for cache keys
        id: windows-features
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -z "$FEATURES" ]; then
            FEATURES="default"
          fi
          FEATURES="${FEATURES//,/-}"
          echo "sanitized=$FEATURES" >> "$GITHUB_OUTPUT"
        shell: bash

      # Compiler/dependency cache. Advisory only: tests must run if cache restore fails.
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-windows-${{ matrix.rust }}-${{ steps.windows-features.outputs.sanitized }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Trybuild creates transient target/tests/target trees on Windows; skip
          # target caching there so post-job cache scans do not emit ENOENT noise.
          cache-targets: false
          cache-on-failure: true
          cache-all-crates: true

      # Run targeted tests based on features
      - name: Run tests - ${{ matrix.features || 'default' }}
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            echo "Testing with default features..."
            cargo test --verbose
          elif [ "${{ matrix.features }}" == "no-default" ]; then
            echo "Testing with no default features..."
            cargo test --no-default-features --verbose
          else
            echo "Testing with features: ${{ matrix.features }}"
            cargo test --no-default-features --features "${{ matrix.features }}" --verbose
          fi
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}

  # Parallel feature matrix testing for better performance
  feature-matrix-parallel:
    name: Feature Matrix (${{ matrix.features || 'no-features' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""  # no features
          - "mode-blocking"
          - "mode-async"
          - "runtime-tokio"
          - "runtime-smol"
          - "test-utils"
          - "runtime-tokio,test-utils"
          - "runtime-smol,test-utils"
          - "transport-serial"
          # Compatibility-only union: async runtime plus blocking serial dependency.
          - "runtime-tokio,transport-serial"
          - "runtime-tokio,transport-serial-tokio"
          - "serde,schemars,ts-rs"
          - "runtime-tokio,dyn-api,test-utils"
          # Compatibility-only union: smol dyn-api without test helpers.
          - "runtime-smol,dyn-api"
          - "runtime-smol,dyn-api,test-utils"
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # Sanitize features for cache keys (replace commas with hyphens)
      - name: Sanitize features for cache keys
        id: features
        run: |
          SANITIZED_FEATURES="${{ matrix.features }}"
          if [ -z "$SANITIZED_FEATURES" ]; then
            SANITIZED_FEATURES="no-features"
          fi
          SANITIZED_FEATURES="${SANITIZED_FEATURES//,/-}"
          echo "sanitized=${SANITIZED_FEATURES}" >> $GITHUB_OUTPUT

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-features-${{ steps.features.outputs.sanitized }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test features - ${{ matrix.features || 'no-features' }}
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            echo "Testing with no features..."
            cargo test --no-default-features --verbose
            cargo clippy --all-targets --no-default-features -- -D warnings
          else
            echo "Testing with features: ${{ matrix.features }}"
            cargo test --no-default-features --features "${{ matrix.features }}" --verbose
            cargo clippy --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
          fi
        env:
          TMPDIR: ${{ runner.temp }}

  # Miri safety checks for unsafe code
  miri:
    name: Miri Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on main branch and PRs to avoid overwhelming CI
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust nightly and miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup miri
        run: cargo miri setup

      # Restrict Miri to library tests. Integration tests intentionally exercise
      # real socket I/O and OS resolution paths, which belong in the normal CI matrix
      # rather than Miri's isolation model.
      - name: Run miri tests (no features)
        run: cargo miri test --lib --no-default-features

      - name: Run miri tests (mode-async)
        run: cargo miri test --lib --no-default-features --features mode-async

      - name: Run miri tests (runtime-tokio)
        run: cargo miri test --lib --no-default-features --features runtime-tokio

  # Cross-compilation testing
  cross-compile:
    name: Cross Compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          # x86_64-pc-windows-gnu: Temporarily disabled due to Rust 1.92 GetHostNameW linking bug
          # See: https://github.com/rust-lang/rust/issues/issue-number (upstream fix pending)
          - wasm32-unknown-unknown
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-cross-${{ matrix.target }}"
          save-if: false

      # Different features for different targets
      - name: Cross compile for ${{ matrix.target }}
        run: |
          if [[ "${{ matrix.target }}" == "wasm32-unknown-unknown" ]]; then
            # WASM doesn't support certain features
            cross build --target ${{ matrix.target }} --no-default-features --features mode-async
          else
            # Other targets can use full features
            cross build --target ${{ matrix.target }} --no-default-features --features runtime-tokio
          fi

      # Also test that examples compile for the target
      - name: Build examples for ${{ matrix.target }}
        if: matrix.target != 'wasm32-unknown-unknown'
        run: |
          cross build --examples --target ${{ matrix.target }} --no-default-features --features runtime-tokio

  # Combined lint and doc check
  lint-and-docs:
    name: Lint & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Use parallel clippy checks via script
      - name: Run comprehensive clippy checks
        run: |
          cat > /tmp/clippy-features.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "Running comprehensive clippy checks..."

          features=(
            ""
            "mode-blocking"
            "mode-async"
            "runtime-tokio"
            "runtime-smol"
            "test-utils"
            "runtime-tokio,test-utils"
            "runtime-smol,test-utils"
            "transport-serial"
            # Compatibility-only union: async runtime plus blocking serial dependency.
            "runtime-tokio,transport-serial"
            "runtime-tokio,transport-serial-tokio"
            "serde,schemars,ts-rs"
            "runtime-tokio,dyn-api,test-utils"
            # Compatibility-only union: smol dyn-api without test helpers.
            "runtime-smol,dyn-api"
            "runtime-smol,dyn-api,test-utils"
          )

          for feature in "${features[@]}"; do
            if [ -z "$feature" ]; then
              echo "Clippy: no features"
              cargo clippy --all-targets --no-default-features -- -D warnings
            else
              echo "Clippy: $feature"
              cargo clippy --all-targets --no-default-features --features "$feature" -- -D warnings
            fi
          done

          # Check all features (lib only)
          cargo clippy --lib --all-features -- -D warnings

          # Check the macro crate
          cargo clippy -p grafton-visca-macros --all-targets -- -D warnings

          # Check examples
          cargo clippy --examples --no-default-features --features runtime-tokio -- -D warnings
          EOF

          chmod +x /tmp/clippy-features.sh
          /tmp/clippy-features.sh

      # Documentation checks
      - name: Check documentation
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
        run: |
          # Check documentation builds for different feature sets
          cargo doc --no-deps --no-default-features
          cargo doc --no-deps --no-default-features --features runtime-tokio
          cargo doc --no-deps --all-features

          # Check private items documentation
          cargo doc --document-private-items --no-deps --no-default-features --features runtime-tokio

          # Check macro crate documentation
          cargo doc -p grafton-visca-macros --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Async transport integration tests
  async-transport-integration:
    name: Async Transport Integration (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        runtime: [runtime-tokio, runtime-smol]
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-async-${{ matrix.runtime }}"
          save-if: false

      - name: Run Send futures compile tests (${{ matrix.runtime }})
        run: |
          cargo test --no-default-features --features ${{ matrix.runtime }},test-utils \
            --test send_futures_compile_test

      - name: Run API stability tests (${{ matrix.runtime }})
        run: |
          cargo test --no-default-features --features ${{ matrix.runtime }} \
            --test api_stability_test

      - name: Test runtime coexistence (${{ matrix.runtime }})
        run: |
          echo "Testing that multiple runtime features can coexist..."

          case "${{ matrix.runtime }}" in
            "runtime-tokio")
              other_runtime="runtime-smol"
              ;;
            "runtime-smol")
              other_runtime="runtime-tokio"
              ;;
          esac

          if cargo check --no-default-features --features ${{ matrix.runtime }},$other_runtime 2>/dev/null; then
            echo "✅ Runtime coexistence working correctly for ${{ matrix.runtime }} + $other_runtime"
          else
            echo "ERROR: Multiple runtime features should be able to coexist"
            exit 1
          fi

  # Semver compatibility check
  semver:
    name: Check semver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false

      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: only-explicit-features
          features: runtime-tokio,transport-serial,transport-serial-tokio,serde,schemars,ts-rs,dyn-api,test-utils

  # Check package metadata and dependencies
  package-check:
    name: Package Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false

      # Package verification for releases
      - name: Check package (release tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RUSTC_WRAPPER: ""  # Disable sccache for packaging
        run: |
          echo "Running package check for release tag..."
          # Only check the macros crate can be packaged
          # The main crate check happens in the publish job after macros is published
          cargo package -p grafton-visca-macros --no-verify

      # Build validation for non-releases
      - name: Build validation (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Running build validation for non-release..."
          cargo build --no-default-features --features runtime-tokio --workspace
          cargo build --examples --no-default-features --features runtime-tokio
          cargo metadata --format-version 1 > /dev/null

      # Security audit
      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

  # Summary job to ensure all required checks pass
  ci-success:
    name: CI Success
    if: always()
    needs:
      - format
      - test-unix
      - test-windows
      - feature-matrix-parallel
      - lint-and-docs
      - async-transport-integration
      - cross-compile
      - package-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check if all jobs succeeded
        run: |
          # Check for failures (but ignore skipped jobs)
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs were cancelled"
            exit 1
          else
            echo "All required jobs passed or were skipped successfully"
          fi

  # Publish job
  publish:
    name: Publish
    needs: [ci-success]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false

      # Dry run first
      - name: Publish macro crate dry run
        env:
          RUSTC_WRAPPER: ""  # Disable sccache for packaging
        run: cargo publish -p grafton-visca-macros --dry-run

      # Publish macro crate first
      - name: Publish grafton-visca-macros to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          RUSTC_WRAPPER: ""  # Disable sccache for packaging
        run: cargo publish -p grafton-visca-macros

      # Wait for crates.io indexing
      - name: Wait for crates.io indexing
        run: sleep 30

      # Publish main crate
      - name: Publish grafton-visca to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          RUSTC_WRAPPER: ""  # Disable sccache for packaging
        run: cargo publish
