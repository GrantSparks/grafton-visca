name: Rust 2.0 CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*.*.*"]
  # no base-branch filter: stacked PRs (feature-branch bases) must run CI too
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  feature-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default pure engine/domain
            command: --no-default-features --lib
          - name: default blocking + tcp
            command: --workspace --all-targets
          - name: blocking-only
            command: --no-default-features --features blocking --all-targets
          - name: runtime-neutral async
            command: --no-default-features --features async --all-targets
          - name: Tokio
            command: --no-default-features --features runtime-tokio --all-targets
          - name: smol
            command: --no-default-features --features runtime-smol --all-targets
          - name: Tokio + smol
            command: --no-default-features --features runtime-tokio,runtime-smol --all-targets
          - name: blocking + Tokio
            command: --no-default-features --features blocking,runtime-tokio --all-targets
          - name: blocking + smol
            command: --no-default-features --features blocking,runtime-smol --all-targets
          - name: blocking + Tokio + smol
            command: --no-default-features --features blocking,runtime-tokio,runtime-smol --all-targets
          - name: Tokio + dyn-api
            command: --no-default-features --features runtime-tokio,dyn-api --all-targets
          - name: smol + dyn-api
            command: --no-default-features --features runtime-smol,dyn-api --all-targets
          - name: blocking + async + dyn-api
            command: --no-default-features --features blocking,async,dyn-api --all-targets
          - name: blocking serial
            command: --no-default-features --features transport-serial --all-targets
          - name: Tokio serial
            command: --no-default-features --features runtime-tokio,transport-serial-tokio --all-targets
          - name: serde + schemars + ts-rs
            command: --no-default-features --features serde,schemars,ts-rs --all-targets
          - name: test-utils
            command: --no-default-features --features test-utils --all-targets
    steps:
      - uses: actions/checkout@v4
      - name: Install serial transport dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: matrix-${{ matrix.name }}
      - run: cargo test ${{ matrix.command }}

  macro-derives:
    name: macro derives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p grafton-visca-macros

  all-features:
    name: all features and targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  examples:
    name: examples and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build supported example surfaces
        run: |
          set -euo pipefail
          cargo check --examples --no-default-features --features blocking
          cargo check --examples --no-default-features --features runtime-tokio
          cargo check --examples --no-default-features --features runtime-smol
          cargo check --examples --all-features
      - name: Build strict documentation and run doctests
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo doc --workspace --all-features --no-deps
          cargo test --doc --no-default-features
          cargo test --doc --no-default-features --features async
          cargo test --doc --all-features

  lint:
    name: clippy and rustdoc warnings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --lib --no-default-features -- -D warnings
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check --lib --no-default-features --features async
      - run: cargo check --lib --no-default-features --features runtime-tokio,dyn-api

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/miri-tests.sh

  fuzz:
    name: cargo-fuzz parser harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz 0.12.0
        run: cargo +stable install cargo-fuzz --version 0.12.0 --locked
      - name: Check parser fuzz target
        run: cargo +nightly fuzz check response_parser
      - name: Run bounded parser fuzz smoke test
        run: cargo +nightly fuzz run response_parser -- -runs=1000

  removed-features:
    name: removed feature names are unknown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check explicit unknown-feature diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for feature in mode-async async-core mode-blocking; do
            output_file="${RUNNER_TEMP}/removed-${feature}.log"
            if cargo check --no-default-features --features "${feature}" >"${output_file}" 2>&1; then
              cat "${output_file}"
              echo "::error::removed feature ${feature} unexpectedly succeeded"
              exit 1
            fi
            grep -Fq "does not contain this feature: ${feature}" "${output_file}"
          done

  release-validation:
    name: release validator regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check clean-checkout and hardware gates
        run: bash .github/scripts/test-validate-release.sh

  public-api:
    name: public API RC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default
            cargo_args: --no-default-features
          - name: blocking
            cargo_args: --no-default-features --features blocking
          - name: async
            cargo_args: --no-default-features --features async
          - name: tokio-dyn
            cargo_args: --no-default-features --features runtime-tokio,dyn-api
          - name: smol-dyn
            cargo_args: --no-default-features --features runtime-smol,dyn-api
          - name: coexistence
            cargo_args: --no-default-features --features blocking,runtime-tokio,dyn-api
          - name: all-features
            cargo_args: --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Diff ${{ matrix.name }} snapshot
        shell: bash
        run: |
          set -euo pipefail
          generated="${RUNNER_TEMP}/${{ matrix.name }}.txt"
          cargo public-api --color never ${{ matrix.cargo_args }} >"${generated}"
          test -s "${generated}"
          diff -u "api/2.0.0-rc.1/${{ matrix.name }}.txt" "${generated}"

  downstream:
    name: Synemantic 2.0 contract fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path tests/fixtures/synemantic_2_0/Cargo.toml
      - name: Report external-head limitation
        run: >-
          echo "External Synemantic main is not asserted: its published manifest
          still targets the 1.x feature surface and private sibling paths; the
          local RC fixture above is the reproducible contract."

  ci-success:
    name: CI success
    if: always()
    needs:
      - format
      - feature-matrix
      - macro-derives
      - all-features
      - examples
      - lint
      - msrv
      - miri
      - fuzz
      - removed-features
      - release-validation
      - public-api
      - downstream
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required CI jobs failed or was cancelled."
            exit 1
          fi
