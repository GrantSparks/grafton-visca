name: Rust CI/CD

on:
  push:
    branches: ["main", "feature/*"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1
  CACHE_VERSION: v1

jobs:
  # Quick format check (no dependencies needed)
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
        continue-on-error: true
        id: nightly-toolchain
      
      # Fallback: retry with rustup directly if the action fails
      - name: Retry nightly toolchain installation
        if: steps.nightly-toolchain.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install nightly --component rustfmt --profile minimal && break
            sleep 30
          done
      - run: cargo fmt --all -- --check


  # Test on minimal platform for feature branches
  test-minimal:
    name: Test (ubuntu-latest / stable)
    # Only run on feature branch pushes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Install system dependencies for serialport
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
      
      # Test the main configurations
      - name: Test blocking mode (no features)
        run: cargo test --no-default-features --verbose
        env:
          TMPDIR: ${{ runner.temp }}
      
      - name: Test async mode
        run: cargo test --no-default-features --features async --verbose
        env:
          TMPDIR: ${{ runner.temp }}
      
      - name: Test with tokio runtime
        run: cargo test --no-default-features --features rt-tokio --verbose
        env:
          TMPDIR: ${{ runner.temp }}
      
      # Test with additional features but avoid --all-features due to compile-time guards
      - name: Test with tokio + serial features
        run: cargo test --no-default-features --features rt-tokio,serial --verbose
        env:
          TMPDIR: ${{ runner.temp }}

  # Test on multiple platforms and Rust versions (skip on feature branches)
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    # Skip on feature branch pushes (use test-minimal instead)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      # Install system dependencies for serialport
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      
      - name: Install Rust ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
        continue-on-error: true
        id: matrix-toolchain
      
      # Fallback: retry with rustup directly if the action fails
      - name: Retry ${{ matrix.rust }} toolchain installation
        if: steps.matrix-toolchain.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install ${{ matrix.rust }} --profile minimal && break
            sleep 30
          done
      
      - uses: Swatinem/rust-cache@v2
        with:
          # Use a shared cache key per OS to optimize storage
          shared-key: "rust-cache-${{ matrix.os }}-${{ matrix.rust }}"
          # Only save cache on main branch to avoid cache thrashing
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      # Test the three main configurations
      
      # Configuration 1: Blocking mode (no features)
      - name: Test blocking mode (no features)
        run: |
          echo "Testing blocking mode (no features)..."
          cargo test --no-default-features --verbose
        env:
          TMPDIR: ${{ runner.temp }}
      
      # Configuration 2: Runtime-agnostic async (async feature only)
      - name: Test runtime-agnostic async (async feature only)
        run: |
          echo "Testing runtime-agnostic async (async feature only)..."
          cargo test --no-default-features --features async --verbose
      
      # Configuration 3: Tokio runtime (rt-tokio feature, which implies async)
      - name: Test tokio runtime (rt-tokio feature)
        run: |
          echo "Testing tokio runtime (rt-tokio feature)..."
          cargo test --no-default-features --features rt-tokio --verbose
      
      # Test additional runtime configurations
      - name: Test async-std runtime
        run: |
          echo "Testing async-std runtime..."
          cargo test --no-default-features --features rt-async-std --verbose
      
      - name: Test smol runtime
        run: |
          echo "Testing smol runtime..."
          cargo test --no-default-features --features rt-smol --verbose
      
      # Test the macro crate specifically
      - name: Test grafton-visca-macros
        run: cargo test -p grafton-visca-macros --verbose
      
      # Build examples for the three configurations (only on stable)
      - name: Build blocking examples (no features)
        if: matrix.rust == 'stable'
        run: |
          echo "Building blocking examples..."
          cargo build --examples --no-default-features
      
      - name: Build async examples (async feature only)
        if: matrix.rust == 'stable'
        run: |
          echo "Building async examples (runtime-agnostic)..."
          cargo build --examples --no-default-features --features async
      
      - name: Build tokio examples (rt-tokio feature)
        if: matrix.rust == 'stable'
        run: |
          echo "Building tokio examples..."
          cargo build --examples --no-default-features --features rt-tokio

  # Combined lint and doc check  
  lint-and-docs:
    name: Lint & Docs
    runs-on: ubuntu-latest
    # Run lighter version on feature branches
    steps:
      - uses: actions/checkout@v4
      
      # Install system dependencies for serialport
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
        continue-on-error: true
        id: toolchain
      
      # Fallback: retry with rustup directly if the action fails
      - name: Retry Rust toolchain installation
        if: steps.toolchain.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install stable --component clippy --profile minimal && break
            sleep 30
          done
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      # Run Clippy on the three main configurations
      - name: Clippy blocking mode (no features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      
      - name: Clippy async mode (async feature only)
        run: cargo clippy --all-targets --no-default-features --features async -- -D warnings
      
      - name: Clippy tokio mode (rt-tokio feature)
        run: cargo clippy --all-targets --no-default-features --features rt-tokio -- -D warnings
      
      # Check additional runtime configurations
      - name: Clippy async-std mode
        run: cargo clippy --all-targets --no-default-features --features rt-async-std -- -D warnings
      
      - name: Clippy smol mode
        run: cargo clippy --all-targets --no-default-features --features rt-smol -- -D warnings
      
      # Check with additional features but avoid --all-features due to compile-time guards
      - name: Clippy tokio + serial features
        run: cargo clippy --all-targets --no-default-features --features rt-tokio,serial -- -D warnings
      
      # Check the macro crate
      - name: Clippy grafton-visca-macros
        run: cargo clippy -p grafton-visca-macros --all-targets -- -D warnings
      
      # Check examples specifically (use tokio runtime for examples)
      - name: Clippy examples
        run: cargo clippy --examples --no-default-features --features rt-tokio -- -D warnings
      
      # Skip heavy documentation checks on feature branches
      - name: Check documentation (blocking)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
        run: |
          cargo doc --no-deps --no-default-features
          cargo doc --document-private-items --no-deps --no-default-features
      
      - name: Check documentation (tokio)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
        run: |
          cargo doc --no-deps --no-default-features --features rt-tokio
          cargo doc --document-private-items --no-deps --no-default-features --features rt-tokio
      
      # Check documentation for macro crate
      - name: Check macro crate documentation
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
        run: cargo doc -p grafton-visca-macros --no-deps
      
      # Check for broken doc links
      - name: Check doc links (blocking)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      
      - name: Check doc links (tokio)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
        run: cargo doc --no-deps --no-default-features --features rt-tokio
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Feature matrix verification
  feature-matrix:
    name: Feature Matrix Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        id: stable-toolchain-features
      
      # Fallback: retry with rustup directly if the action fails  
      - name: Retry stable toolchain installation
        if: steps.stable-toolchain-features.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install stable --profile minimal && break
            sleep 30
          done
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      # Test 1: Verify no async dependencies in blocking mode
      - name: Check no async deps in blocking mode
        run: |
          echo "Checking that blocking mode has no async dependencies..."
          cargo tree --no-default-features | grep -E "tokio|async-std|smol|futures" && \
            (echo "ERROR: Found async dependencies in blocking mode!" && exit 1) || \
            echo "✅ No async dependencies found in blocking mode"
      
      # Test 2: Verify blocking types are NOT exported when async is enabled
      - name: Verify API separation
        run: |
          echo "Testing that blocking types are not exported with async feature..."
          
          # First, build the library with async feature
          cargo build --no-default-features --features async
          
          # Create a test file that tries to use blocking types
          cat > /tmp/test_blocking_types.rs << 'EOF'
          use grafton_visca::transport::{BlockingTcp, BlockingUdp};
          
          fn main() {
              println!("If this compiles, blocking types are incorrectly exported!");
          }
          EOF
          
          # Try to compile - this should FAIL when async feature is enabled
          if rustc --edition 2021 /tmp/test_blocking_types.rs \
                   -L target/debug/deps \
                   --extern grafton_visca=target/debug/libgrafton_visca.rlib \
                   2>&1 | grep -q "unresolved import"; then
            echo "✅ Blocking types correctly NOT exported with async feature"
          else
            # Check if it actually compiled successfully
            if rustc --edition 2021 /tmp/test_blocking_types.rs \
                     -L target/debug/deps \
                     --extern grafton_visca=target/debug/libgrafton_visca.rlib \
                     2>/dev/null; then
              echo "ERROR: Blocking types are exported when async is enabled!"
              exit 1
            else
              # Compilation failed for another reason, show the actual error
              echo "Test compilation failed (checking error message):"
              rustc --edition 2021 /tmp/test_blocking_types.rs \
                    -L target/debug/deps \
                    --extern grafton_visca=target/debug/libgrafton_visca.rlib \
                    2>&1
              echo "✅ Blocking types correctly NOT exported (compilation failed as expected)"
            fi
          fi
      
      # Test 3: Verify examples compile with correct features
      - name: Test examples compilation
        run: |
          echo "Testing example compilation..."
          
          # Blocking examples should work without async
          cargo build --example quickstart --no-default-features
          echo "✅ Blocking example compiles without async"
          
          # Async examples should require async feature
          cargo build --example quickstart_async --no-default-features --features rt-tokio
          echo "✅ Async example compiles with rt-tokio"
          
          # Runtime agnostic should work with just async
          cargo build --example runtime_agnostic --no-default-features --features async
          echo "✅ Runtime agnostic example compiles with async only"

  # Phase 6 specific tests - Send futures and API stability
  phase6-tests:
    name: Phase 6 Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [rt-tokio, rt-async-std, rt-smol]
    steps:
      - uses: actions/checkout@v4
      
      # Install system dependencies for serialport
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        id: stable-toolchain-phase6
      
      # Fallback: retry with rustup directly if the action fails
      - name: Retry stable toolchain installation
        if: steps.stable-toolchain-phase6.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install stable --profile minimal && break
            sleep 30
          done
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false
      
      - name: Run Send futures compile tests (${{ matrix.runtime }})
        run: |
          cargo test --no-default-features --features async,${{ matrix.runtime }},test-utils \
            --test send_futures_compile_test
      
      - name: Run API stability tests (${{ matrix.runtime }})
        run: |
          cargo test --no-default-features --features async,${{ matrix.runtime }} \
            --test api_stability_test
      
      - name: Run connect_dyn() builder tests (${{ matrix.runtime }})
        run: |
          cargo test --no-default-features --features async,${{ matrix.runtime }},test-utils \
            --test connect_dyn_builders_test
      
      # Test that multiple runtime features fail to compile (compile-time guards)
      - name: Test compile-time runtime guards (${{ matrix.runtime }})
        run: |
          echo "Testing that multiple runtime features fail to compile..."
          
          # Test that combining this runtime with another fails
          case "${{ matrix.runtime }}" in
            "rt-tokio")
              other_runtime="rt-async-std"
              ;;
            "rt-async-std")
              other_runtime="rt-smol"
              ;;
            "rt-smol")
              other_runtime="rt-tokio"
              ;;
          esac
          
          if cargo check --no-default-features --features async,${{ matrix.runtime }},$other_runtime 2>/dev/null; then
            echo "ERROR: Multiple runtime features should fail to compile"
            exit 1
          else
            echo "✅ Compile-time guard working correctly for ${{ matrix.runtime }} + $other_runtime"
          fi

  # Semver compatibility check
  semver:
    name: Check semver
    runs-on: ubuntu-latest
    # Only run on PRs to avoid checking on the initial commit
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      # Install system dependencies for serialport
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        id: stable-toolchain-semver
      
      # Fallback: retry with rustup directly if the action fails  
      - name: Retry stable toolchain installation
        if: steps.stable-toolchain-semver.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install stable --profile minimal && break
            sleep 30
          done
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false  # Don't save cache in semver job
      
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # Check package metadata and dependencies
  package-check:
    name: Package Check
    runs-on: ubuntu-latest
    # Skip package check on PRs and feature branches
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
    steps:
      - uses: actions/checkout@v4
      
      # Install system dependencies for serialport
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        id: stable-toolchain-pkg
      
      # Fallback: retry with rustup directly if the action fails  
      - name: Retry stable toolchain installation
        if: steps.stable-toolchain-pkg.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install stable --profile minimal && break
            sleep 30
          done
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false
      
      # Only do full package verification on tags (releases)
      # For regular CI runs, just verify the crates build correctly
      - name: Check package (release tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Running full package check for release tag..."
          cargo package -p grafton-visca-macros --no-verify
          cargo package --no-verify
      
      # For non-release runs, just verify everything builds
      - name: Build validation (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Running build validation for non-release..."
          # Verify the workspace builds with tokio runtime (most common)
          cargo build --no-default-features --features rt-tokio --workspace
          # Verify examples build
          cargo build --examples --no-default-features --features rt-tokio
          # Quick check that the manifest is valid
          cargo metadata --format-version 1 > /dev/null
      
      # Check for security vulnerabilities
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Security audit
        run: cargo audit

  # Publish job
  publish:
    name: Publish
    needs: [format, test, lint-and-docs, feature-matrix, phase6-tests, package-check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Install system dependencies for serialport
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        id: stable-toolchain-publish
      
      # Fallback: retry with rustup directly if the action fails  
      - name: Retry stable toolchain installation
        if: steps.stable-toolchain-publish.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install stable --profile minimal && break
            sleep 30
          done
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false  # Don't save cache in publish job
      
      # Dry run first to catch any issues
      - name: Publish macro crate dry run
        run: cargo publish -p grafton-visca-macros --dry-run
      
      # Skip main crate dry run as it depends on macro crate being published
      # The actual publish will validate it
      
      # Publish macro crate first (dependency)
      - name: Publish grafton-visca-macros to crates.io
        run: cargo publish -p grafton-visca-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
      
      # Wait a bit for crates.io to index the macro crate
      - name: Wait for crates.io indexing
        run: sleep 30
      
      # Then publish the main crate
      - name: Publish grafton-visca to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}