name: Rust 2.0 CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*.*.*"]
  # no base-branch filter: stacked PRs (feature-branch bases) must run CI too
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

# Toolchain pinning policy
#
# The public API gate compares `api/2.0.0-rc.1/*.txt` byte for byte, while the
# compile-contract gate checks exact diagnostic codes and stable message
# anchors declared inside each fixture. Floating `@stable`/`@nightly` refs
# would still make those gates move without a source change, so every toolchain
# used here is pinned to an exact compiler version and every action invocation
# is pinned to immutable action code:
#
#   * stable compiler 1.98.0 -> generated action commit
#     f8be11a05b1d4f3fcebe6410cc16743212b999b0
#   * nightly compiler nightly-2026-08-26 -> action commit
#     6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 (the master's 2026-08-28 code)
#   * MSRV compiler 1.88.0 -> generated action commit
#     2eae45db285e407f22119950686d47e1101e071b
#
# A `rust-toolchain.toml` is deliberately not used: `dtolnay/rust-toolchain`
# selects a toolchain with `rustup default`, which a `rust-toolchain.toml`
# directory override would silently win over, breaking the MSRV and nightly
# jobs. The generated stable/MSRV actions embed their compiler version; the
# nightly action commit is only the installer code and the `toolchain:` input
# selects the exact nightly compiler. Keeping both values visible prevents
# an action-code pin from being mistaken for a compiler-version pin.
#
# Bumping stable requires running every compile-contract feature leg and
# reviewing any diagnostic anchors rustc changed. Bumping nightly requires
# regenerating the public API snapshots; see `api/2.0.0-rc.1/README.md`.

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # action commit 6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 (master snapshot 2026-08-28; compiler set below)
        with:
          toolchain: nightly-2026-08-26
          components: rustfmt
      - run: cargo +nightly-2026-08-26 fmt --all -- --check

  feature-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default pure engine/domain + smoke
            command: --no-default-features --lib --test no_default_smoke
          - name: default blocking
            command: --workspace --all-targets
          - name: blocking-only
            command: --no-default-features --features blocking --all-targets
          - name: blocking + dyn-api
            command: --no-default-features --features blocking,dyn-api --all-targets
          - name: runtime-neutral async
            command: --no-default-features --features async --all-targets
          - name: Tokio
            command: --no-default-features --features runtime-tokio --all-targets
          - name: smol
            command: --no-default-features --features runtime-smol --all-targets
          - name: Tokio + smol
            command: --no-default-features --features runtime-tokio,runtime-smol --all-targets
          - name: blocking + Tokio
            command: --no-default-features --features blocking,runtime-tokio --all-targets
          - name: blocking + smol
            command: --no-default-features --features blocking,runtime-smol --all-targets
          - name: blocking + Tokio + smol
            command: --no-default-features --features blocking,runtime-tokio,runtime-smol --all-targets
          - name: Tokio + dyn-api
            command: --no-default-features --features runtime-tokio,dyn-api --all-targets
          - name: smol + dyn-api
            command: --no-default-features --features runtime-smol,dyn-api --all-targets
          - name: blocking + async + dyn-api
            command: --no-default-features --features blocking,async,dyn-api --all-targets
          - name: blocking serial
            command: --no-default-features --features transport-serial --all-targets
          - name: Tokio serial
            command: --no-default-features --features runtime-tokio,transport-serial-tokio --all-targets
          - name: smol + Tokio serial API contract
            command: --no-default-features --features runtime-smol,transport-serial-tokio --test api_stability_test
          # Compatibility-only union: the async runtime alongside the *blocking*
          # serial dependency. This is the leg the README feature-union table
          # promises; `transport-serial-tokio` above is a different tree.
          - name: Tokio + blocking serial
            command: --no-default-features --features runtime-tokio,transport-serial --all-targets
          - name: serde + schemars + ts-rs
            command: --no-default-features --features serde,schemars,ts-rs --all-targets
          # `test-utils` alone proves the toolkit compiles with no facade
          # selected. It cannot *run* the toolkit: `ScriptedBlockingTransport`
          # needs `blocking`, `ScriptedTransport` and `DeterministicExecutor`
          # need `async`, so every test that drives them is compiled away here.
          - name: test-utils
            command: --no-default-features --features test-utils --all-targets
          # The union that actually executes the shipped test toolkit. Without
          # it 40 tests exist in the tree and run in no job: 10 in
          # `tests/issue_566_scripted_error_recovery.rs`, 5 in
          # `tests/inquiry_simulator_test.rs`, 4 in
          # `tests/timeout_category_tests.rs`, 15 in the `testkit`
          # deterministic-executor tests, 5 in its scripted-transport tests,
          # and 1 in the `src/blocking.rs` testkit unit test. `test-utils` is
          # never unioned with a facade anywhere else in this matrix and the
          # all-features job below is a `cargo check`, not a `cargo test`.
          - name: test-utils + blocking + Tokio
            command: --no-default-features --features test-utils,blocking,runtime-tokio --all-targets
          # The workspace/default leg leaves this fixture's optional serde,
          # schemars, and ts-rs oracle cfg'd out; `all-features` below is only
          # a check. This executes its behavioral contract test instead.
          - name: renamed range helper derives
            command: -p phase4-renamed-dependency --features range-helper-derives --all-targets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install serial transport dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: matrix-${{ matrix.name }}
      - run: cargo test ${{ matrix.command }}

  blocking-dependency-boundary:
    name: native blocking dependency boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bash .github/scripts/check-blocking-dependency-boundary.sh

  macro-derives:
    name: macro derives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p grafton-visca-macros
      - name: Check re-exported range macro with helpers off and on
        env:
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/range-macro-reexport-bindings
        run: |
          set -euo pipefail
          export_path="${TS_RS_EXPORT_DIR}/ReexportedRange.ts"
          test ! -e "${export_path}"
          cargo test --manifest-path tests/fixtures/range_type_reexport/Cargo.toml \
            -p range-macro-consumer
          cargo test --manifest-path tests/fixtures/range_type_reexport/Cargo.toml \
            -p range-macro-consumer --features range-helper-derives
          test -s "${export_path}"
          grep -Fq 'export type ReexportedRange = number;' "${export_path}"

  all-features:
    name: all features and targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check public Error variant production reachability
        run: bash .github/scripts/check-error-variant-reachability.sh
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-features --all-targets

  examples:
    name: examples and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build supported example surfaces
        run: |
          set -euo pipefail
          cargo check --examples --no-default-features --features blocking
          cargo check --examples --no-default-features --features blocking,dyn-api
          cargo check --examples --no-default-features --features runtime-tokio
          cargo check --examples --no-default-features --features runtime-smol
          cargo check --examples --all-features
      - name: Build strict documentation and run doctests
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo doc --workspace --all-features --no-deps
          # Keep this blocking-free surface strict: all-features makes
          # blocking-only intra-doc links resolve and would mask their cfg.
          cargo doc --no-default-features --features runtime-tokio,dyn-api --no-deps
          cargo test --doc --no-default-features
          cargo test --doc --no-default-features --features async
          # Default features compile the README quick start through the
          # cfg(doctest) README gate in src/lib.rs.
          cargo test --doc
          cargo test --doc --no-default-features --features blocking,dyn-api
          cargo test --doc --all-features

  lint:
    name: clippy and rustdoc warnings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --lib --no-default-features -- -D warnings
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Prove MSRV selection ignores directory overrides
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d "${RUNNER_TEMP}/msrv-toolchain-probe.XXXXXX")"
          cleanup() {
            find "${probe}" -depth -delete
          }
          trap cleanup EXIT
          printf '[toolchain]\npath = "%s"\n' \
            "${probe}/not-a-toolchain" >"${probe}/rust-toolchain.toml"
          (
            cd "${probe}"
            test "$(rustc --version --verbose | sed -n 's/^release: //p')" = "1.88.0"
            test "$(cargo --version | cut -d ' ' -f2)" = "1.88.0"
          )
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Do not rely on the action's rustup default here: a checked-in
      # rust-toolchain.toml takes precedence over it. Every MSRV invocation
      # selects 1.88 explicitly so such a file cannot turn this into a
      # newer-toolchain false green.
      - run: cargo +1.88.0 check --workspace --all-targets
      - run: cargo +1.88.0 check --workspace --all-targets --no-default-features
      - run: cargo +1.88.0 check --lib --no-default-features --features async
      - run: cargo +1.88.0 check --lib --no-default-features --features runtime-tokio,dyn-api
      - name: Check re-exported range macro at MSRV with helpers off and on
        run: |
          set -euo pipefail
          cargo +1.88.0 check \
            --manifest-path tests/fixtures/range_type_reexport/Cargo.toml \
            -p range-macro-consumer --all-targets
          cargo +1.88.0 check \
            --manifest-path tests/fixtures/range_type_reexport/Cargo.toml \
            -p range-macro-consumer --features range-helper-derives --all-targets

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # action commit 6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 (master snapshot 2026-08-28; compiler set below)
        with:
          toolchain: nightly-2026-08-26
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bash .github/scripts/miri-tests.sh

  fuzz:
    name: cargo-fuzz parser harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `cargo-fuzz` is built with the pinned stable and the harness runs on
      # the pinned nightly, so both toolchains are installed explicitly instead
      # of relying on whatever the runner image happens to ship.
      - name: Install the pinned nightly used to run the fuzz harness
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # action commit 6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 (master snapshot 2026-08-28; compiler set below)
        with:
          toolchain: nightly-2026-08-26
      - name: Install the pinned stable used to build cargo-fuzz
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-fuzz 0.12.0
        run: cargo +1.98.0 install cargo-fuzz --version 0.12.0 --locked
      - name: Check parser fuzz target
        run: cargo +nightly-2026-08-26 fuzz check response_parser
      # The corpus path is `cargo-fuzz`'s own default, named explicitly so the
      # committed seeds are visibly part of the gate rather than an implicit
      # convention. A 1000-execution budget starting from a cold corpus mostly
      # re-derives frame structure; starting from `fuzz/corpus/response_parser`
      # spends it past the frame header instead. See `fuzz/README.md` for the
      # seed layout and for what to do with a crash artifact.
      - name: Run bounded parser fuzz smoke test
        run: |
          cargo +nightly-2026-08-26 fuzz run response_parser \
            "${GITHUB_WORKSPACE}/fuzz/corpus/response_parser" -- -runs=1000
      # A crash reproducer is only useful if it leaves the runner. Upload it so
      # it can be committed into the corpus as a permanent regression seed.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  release-validation:
    name: release validator regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Change-record validation compares the PR head with its merge base
          # and audits individual commit bodies.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Check changelog and commit-history integrity
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "${PR_BASE_SHA}" && -n "${PR_HEAD_SHA}" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="$(git rev-parse HEAD^)"
            head="HEAD"
          fi
          python3 .github/scripts/validate-change-record.py "${base}" "${head}"
          bash .github/scripts/test-validate-change-record.sh
      - name: Check clean-checkout, hardware, and registry-payload gates
        run: |
          bash .github/scripts/test-validate-release.sh
          bash .github/scripts/test-verify-crate-payload.sh
          bash .github/scripts/test-verify-release-tag.sh

  behavioral-parity-1x:
    name: 1.x behavioral parity provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The validator reads exact 1.x source blobs with `git show`; shallow
      # history would make its provenance result depend on runner cache state.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: behavioral-parity-1x
      - name: Validate and run the 1.x behavioral corpus
        run: bash .github/scripts/validate-behavioral-parity.sh

  release-drift:
    name: release validator vs. real repository (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory by construction, in two independent ways: it is deliberately
    # absent from `ci-success`'s `needs` list, so it can never block a merge,
    # and its one step always exits 0, reporting drift as an annotation and a
    # job-summary note rather than as a failure.
    #
    # A job-level `continue-on-error: true` does not do that. It stops the
    # *workflow* from failing but still leaves this job concluding "failure",
    # which paints an otherwise-green run red on every pull request for most of
    # a release cycle — and a check that is red by design is a check everyone
    # learns to skip past, which costs exactly the signal this job exists for.
    #
    # `release-validation` above runs the validator against synthetic
    # fixtures, which proves the script works but not that *this* repository
    # would pass it. Running it against the real checkout with the intended
    # next tag surfaces version/pin drift on the pull request that introduces
    # it instead of at publish time.
    #
    # It is expected to report drift for most of a release cycle: the validator
    # requires a dated `## [2.0.0-rc.1] - YYYY-MM-DD` CHANGELOG heading, and
    # RELEASING.md says the 2.0 notes stay under `## [Unreleased]` until the
    # release commit. That single expected finding is why the job is advisory
    # rather than required; the signal it exists for is the *other* findings
    # (a workspace version, an exact macro dependency pin, or a manifest that
    # no longer agrees with the tag being prepared).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      # The tag the next publication is expected to use. Bump it in the same
      # commit that bumps `[workspace.package].version`.
      - name: Validate the intended next tag against this checkout
        shell: bash
        run: |
          set -uo pipefail
          tag=v2.0.0-rc.1
          bash .github/scripts/validate-release.sh "${tag}" && status=0 || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "::notice title=Release drift::The release validator accepts this checkout as ${tag}."
            echo "The release validator accepts this checkout as \`${tag}\`." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "::warning title=Release drift::validate-release.sh ${tag} exited ${status}; see this step's log for the findings. An undated '## [Unreleased]' CHANGELOG heading is expected until the release commit; anything else is real drift."
          {
            echo "### Release drift (advisory)"
            echo
            echo "\`validate-release.sh ${tag}\` exited \`${status}\`. The findings are in this job's step log."
            echo
            echo "An undated \`## [Unreleased]\` heading is expected until the release commit. Any other finding — a workspace version, an exact macro dependency pin, or a manifest that no longer agrees with the tag — is real drift to fix before publishing."
          } >>"${GITHUB_STEP_SUMMARY}"
          # Advisory: the finding is reported, not enforced.
          exit 0

  public-api:
    name: public API RC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Three surfaces, not seven. `blocking` is a strict superset of the bare
        # `--no-default-features` surface and `tokio-dyn` is a strict superset of
        # the `async` surface, so those two legs subsume four of the retired
        # ones; `all-features` covers the rest (including the smol adapter,
        # whose items mirror the tokio ones). See api/2.0.0-rc.1/README.md.
        include:
          - name: blocking
            cargo_args: --no-default-features --features blocking
          - name: tokio-dyn
            cargo_args: --no-default-features --features runtime-tokio,dyn-api
          - name: all-features
            cargo_args: --all-features
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install serial transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      # `cargo public-api` needs a nightly rustdoc to emit rustdoc JSON. When it
      # is run from a stable toolchain it shells out to a bare `+nightly`, which
      # fails outright when no toolchain named `nightly` was ever installed.
      # Install the pinned nightly here and invoke the tool through it, so the
      # snapshot bytes come from one known rustdoc rather than from whatever the
      # runner image happens to carry.
      - name: Install the pinned nightly used for rustdoc JSON
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # action commit 6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 (master snapshot 2026-08-28; compiler set below)
        with:
          toolchain: nightly-2026-08-26
      - name: Install the pinned stable used to build cargo-public-api
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Diff ${{ matrix.name }} snapshot
        shell: bash
        run: |
          set -euo pipefail
          generated="${RUNNER_TEMP}/${{ matrix.name }}.txt"
          cargo +nightly-2026-08-26 public-api --color never --simplified ${{ matrix.cargo_args }} >"${generated}"
          test -s "${generated}"
          diff -u "api/2.0.0-rc.1/${{ matrix.name }}.txt" "${generated}"

  downstream:
    name: Synemantic 2.0 contract fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --manifest-path tests/fixtures/synemantic_2_0/Cargo.toml
      - name: Report external-head limitation
        run: >-
          echo "External Synemantic main is not asserted: its published manifest
          still targets the 1.x feature surface and private sibling paths; the
          local RC fixture above is the reproducible contract."

  windows:
    name: Windows check and serial tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows
          # Compile-contract fixtures build transient nested target trees that
          # are gone by the time the post-job cache scan walks them, which on
          # Windows turns into ENOENT noise. Registry caching still covers most
          # of the cost here.
          cache-targets: false
      - run: cargo check --workspace --all-targets
      # `serialport` is a different implementation on Windows (the Win32 comms
      # API rather than termios), so the blocking serial transport is the leg
      # that actually needs a Windows runner.
      #
      # Be precise about what this proves: no hosted runner has a serial
      # device, so every test below drives an in-process mock implementing
      # `serialport::SerialPort` (`TestSerialPort`, in
      # `src/transport/serial_blocking.rs`). The Win32 backend is *compiled*
      # here — which is the check that catches
      # Windows-only type, cfg, and API-shape breakage — and never executed.
      # Behaviour against a real Win32 port is hardware evidence and belongs in
      # `docs/hardware_release_checklist.md`, not in this job.
      - run: cargo test --no-default-features --features transport-serial

  macos:
    name: macOS check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos
      - run: cargo check --workspace --all-targets
      # `serialport` binds IOKit on macOS; no system package is needed, unlike
      # the libudev install every Linux job performs.
      - run: cargo check --no-default-features --features transport-serial --all-targets

  cargo-audit:
    name: cargo-audit advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit 0.22.2
        # The workflow-wide `-D warnings` is meant for this crate's own code.
        # Applying it to a third-party tool's dependency tree would make an
        # unrelated upstream lint break the security gate.
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-audit --version 0.22.2 --locked
      # `Cargo.lock` is not committed (this is a library), and `cargo audit`
      # reads a lockfile rather than resolving one itself.
      - name: Generate the lockfile to audit
        run: cargo generate-lockfile
      - name: Audit the resolved dependency tree
        run: cargo audit

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned to the commit behind v2.1.1: action tags are mutable, and this
      # job is a supply-chain gate, so it must not follow a moving reference.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  ci-success:
    name: CI success
    if: always()
    needs:
      - format
      - feature-matrix
      - blocking-dependency-boundary
      - macro-derives
      - all-features
      - examples
      - lint
      - msrv
      - miri
      - fuzz
      - release-validation
      - behavioral-parity-1x
      - public-api
      - downstream
      - windows
      - macos
      - cargo-audit
      - cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
          # Keep this set in lockstep with `needs` above.  `toJSON(needs)` is
          # supplied by GitHub after the dependency graph has been evaluated;
          # an accidentally removed dependency would otherwise turn a partial
          # all-success object into a false green aggregate.
          EXPECTED_JOB_IDS: >-
            ["format", "feature-matrix", "blocking-dependency-boundary",
             "macro-derives", "all-features", "examples", "lint", "msrv",
             "miri", "fuzz", "release-validation", "behavioral-parity-1x",
             "public-api", "downstream", "windows", "macos", "cargo-audit",
             "cargo-deny"]
        run: |
          set -euo pipefail
          if ! jq -e --argjson expected "${EXPECTED_JOB_IDS}" '
            type == "object"
            and (keys_unsorted | sort) == ($expected | sort)
            and all(.[]; .result == "success")
          ' <<<"${REQUIRED_JOBS}" >/dev/null; then
            echo "Required CI jobs must match the expected set and all conclude success:"
            jq -r --argjson expected "${EXPECTED_JOB_IDS}" '
              if type != "object" then
                "  needs must be a JSON object (got \(type))"
              else
                "Missing required jobs:"
                , (($expected - keys_unsorted) | sort[]? | "  \(.)")
                , "Unexpected jobs:"
                , ((keys_unsorted - $expected) | sort[]? | "  \(.)")
                , "Present job results:"
                , (to_entries[]
                   | "  \(.key): \(if (.value | type) == "object" then (.value.result // "<missing>") else "<missing>" end)")
              end
            ' <<<"${REQUIRED_JOBS}"
            exit 1
          fi
          echo "Every required CI job concluded success."
