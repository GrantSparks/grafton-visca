name: Rust CI/CD

# Comprehensive CI/CD pipeline with enhanced feature coverage
#
# Key improvements:
# - Parallel feature matrix testing for better performance
# - Enhanced dependency caching with sccache and registry index
# - Miri safety checks for unsafe code
# - Cross-compilation testing
# - Reusable workflows for better organization
# - Job timeouts for reliability
# - Comprehensive feature matrix testing (matches pre-commit hooks)
# - Tests all combinations: default, no-default, async, rt-tokio, rt-async-std, rt-smol, test-utils
# - Enhanced clippy coverage for all feature combinations
# - Platform matrix testing (ubuntu, windows, macos) × (stable, beta)
# - Separate minimal testing for feature branches (faster feedback)
# - Full testing on main/PRs (comprehensive quality assurance)

on:
  push:
    branches: ["main", "feature/*"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1
  CACHE_VERSION: v2
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Quick format check (no dependencies needed)
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
        continue-on-error: true
        id: nightly-toolchain

      # Fallback: retry with rustup directly if the action fails
      - name: Retry nightly toolchain installation
        if: steps.nightly-toolchain.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install nightly --component rustfmt --profile minimal && break
            sleep 30
          done

      - run: cargo fmt --all -- --check

  # Test on minimal platform for feature branches (uses reusable workflow)
  test-minimal:
    name: Test Minimal
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/test-features.yml
    with:
      os: ubuntu-latest
      rust: stable
      features: "minimal"
      runs-on: ubuntu-latest

  # Test on multiple platforms and Rust versions
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    # Skip on feature branch pushes (use test-minimal instead)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Install system dependencies for serialport
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
        continue-on-error: true
        id: matrix-toolchain

      # Fallback: retry with rustup directly if the action fails
      - name: Retry ${{ matrix.rust }} toolchain installation
        if: steps.matrix-toolchain.outcome == 'failure'
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            rustup toolchain install ${{ matrix.rust }} --profile minimal && break
            sleep 30
          done

      # Setup sccache for compiler caching (gracefully handle service outages)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
        id: sccache

      # Enhanced caching with registry index
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ matrix.os }}-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true
          cache-on-failure: true
          cache-all-crates: true

      # Cache cargo registry index
      - name: Cache cargo registry index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-index-${{ matrix.os }}-
            cargo-index-

      # Use reusable workflow for comprehensive testing
      - name: Run comprehensive feature tests
        run: |
          echo "Running comprehensive test suite..."
          bash .github/scripts/test-all-features.sh

  # Parallel feature matrix testing for better performance
  feature-matrix-parallel:
    name: Feature Matrix (${{ matrix.features || 'no-features' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""  # no features
          - "async"
          - "rt-tokio"
          - "rt-async-std"
          - "rt-smol"
          - "test-utils"
          - "rt-tokio,test-utils"
          - "rt-async-std,test-utils"
          - "rt-smol,test-utils"
          - "rt-tokio,serialport"  # legacy compatibility
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      # Sanitize features for cache keys (replace commas with hyphens)
      - name: Sanitize features for cache keys
        id: features
        run: |
          SANITIZED_FEATURES="${{ matrix.features }}"
          SANITIZED_FEATURES="${SANITIZED_FEATURES//,/-}"
          echo "sanitized=${SANITIZED_FEATURES}" >> $GITHUB_OUTPUT

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-features-${{ steps.features.outputs.sanitized }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test features - ${{ matrix.features || 'no-features' }}
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            echo "Testing with no features..."
            cargo test --no-default-features --verbose
            cargo clippy --all-targets --no-default-features -- -D warnings
          else
            echo "Testing with features: ${{ matrix.features }}"
            cargo test --no-default-features --features "${{ matrix.features }}" --verbose
            cargo clippy --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
          fi
        env:
          TMPDIR: ${{ runner.temp }}

  # Miri safety checks for unsafe code
  miri:
    name: Miri Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on main branch and PRs to avoid overwhelming CI
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust nightly and miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup miri
        run: cargo miri setup

      # Run miri on different feature combinations
      - name: Run miri tests (no features)
        run: cargo miri test --no-default-features
        continue-on-error: true  # Don't fail CI if miri finds issues initially

      - name: Run miri tests (async)
        run: cargo miri test --no-default-features --features async
        continue-on-error: true

      - name: Run miri tests (rt-tokio)
        run: cargo miri test --no-default-features --features rt-tokio
        continue-on-error: true

  # Cross-compilation testing
  cross-compile:
    name: Cross Compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-pc-windows-gnu
          - wasm32-unknown-unknown
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-cross-${{ matrix.target }}"
          save-if: false

      # Different features for different targets
      - name: Cross compile for ${{ matrix.target }}
        run: |
          if [[ "${{ matrix.target }}" == "wasm32-unknown-unknown" ]]; then
            # WASM doesn't support certain features
            cross build --target ${{ matrix.target }} --no-default-features --features async
          else
            # Other targets can use full features
            cross build --target ${{ matrix.target }} --no-default-features --features rt-tokio
          fi

      # Also test that examples compile for the target
      - name: Build examples for ${{ matrix.target }}
        if: matrix.target != 'wasm32-unknown-unknown'
        run: |
          cross build --examples --target ${{ matrix.target }} --no-default-features --features rt-tokio

  # Combined lint and doc check
  lint-and-docs:
    name: Lint & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Use parallel clippy checks via script
      - name: Run comprehensive clippy checks
        run: |
          cat > /tmp/clippy-features.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "Running comprehensive clippy checks..."

          features=(
            ""
            "async"
            "rt-tokio"
            "rt-async-std"
            "rt-smol"
            "test-utils"
            "rt-tokio,test-utils"
            "rt-async-std,test-utils"
            "rt-tokio,serialport"
          )

          for feature in "${features[@]}"; do
            if [ -z "$feature" ]; then
              echo "Clippy: no features"
              cargo clippy --all-targets --no-default-features -- -D warnings
            else
              echo "Clippy: $feature"
              cargo clippy --all-targets --no-default-features --features "$feature" -- -D warnings
            fi
          done

          # Check all features (lib only)
          cargo clippy --lib --all-features -- -D warnings

          # Check the macro crate
          cargo clippy -p grafton-visca-macros --all-targets -- -D warnings

          # Check examples
          cargo clippy --examples --no-default-features --features rt-tokio -- -D warnings
          EOF

          chmod +x /tmp/clippy-features.sh
          /tmp/clippy-features.sh

      # Documentation checks
      - name: Check documentation
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/')
        run: |
          # Check documentation builds for different feature sets
          cargo doc --no-deps --no-default-features
          cargo doc --no-deps --no-default-features --features rt-tokio
          cargo doc --no-deps --no-default-features --features rt-async-std
          cargo doc --no-deps --all-features

          # Check private items documentation
          cargo doc --document-private-items --no-deps --no-default-features --features rt-tokio

          # Check macro crate documentation
          cargo doc -p grafton-visca-macros --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Async transport integration tests
  async-transport-integration:
    name: Async Transport Integration (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        runtime: [rt-tokio, rt-async-std, rt-smol]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-async-${{ matrix.runtime }}"
          save-if: false

      - name: Run Send futures compile tests (${{ matrix.runtime }})
        run: |
          cargo test --no-default-features --features async,${{ matrix.runtime }},test-utils \
            --test send_futures_compile_test

      - name: Run API stability tests (${{ matrix.runtime }})
        run: |
          cargo test --no-default-features --features async,${{ matrix.runtime }} \
            --test api_stability_test

      - name: Test runtime coexistence (${{ matrix.runtime }})
        run: |
          echo "Testing that multiple runtime features can coexist..."

          case "${{ matrix.runtime }}" in
            "rt-tokio")
              other_runtime="rt-async-std"
              ;;
            "rt-async-std")
              other_runtime="rt-smol"
              ;;
            "rt-smol")
              other_runtime="rt-tokio"
              ;;
          esac

          if cargo check --no-default-features --features async,${{ matrix.runtime }},$other_runtime 2>/dev/null; then
            echo "✅ Runtime coexistence working correctly for ${{ matrix.runtime }} + $other_runtime"
          else
            echo "ERROR: Multiple runtime features should be able to coexist"
            exit 1
          fi

  # Semver compatibility check
  semver:
    name: Check semver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
        id: sccache

      # Test sccache connectivity and configure if working
      - name: Configure sccache
        if: steps.sccache.outcome == 'success'
        run: |
          if sccache --start-server && sccache --show-stats >/dev/null 2>&1; then
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          else
            echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
          fi
        continue-on-error: true

      # Fallback if sccache setup failed
      - name: Disable sccache fallback
        if: steps.sccache.outcome != 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false

      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: only-explicit-features
          features: rt-tokio,serialport

  # Check package metadata and dependencies
  package-check:
    name: Package Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Setup sccache (gracefully handle service outages)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false

      # Package verification for releases
      - name: Check package (release tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Running full package check for release tag..."
          cargo package -p grafton-visca-macros --no-verify
          cargo package --no-verify

      # Build validation for non-releases
      - name: Build validation (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Running build validation for non-release..."
          cargo build --no-default-features --features rt-tokio --workspace
          cargo build --examples --no-default-features --features rt-tokio
          cargo metadata --format-version 1 > /dev/null

      # Security audit
      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

  # Summary job to ensure all required checks pass
  ci-success:
    name: CI Success
    if: always()
    needs:
      - format
      - test
      - feature-matrix-parallel
      - lint-and-docs
      - async-transport-integration
      - cross-compile
      - package-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          else
            echo "All required jobs passed successfully"
          fi

  # Publish job
  publish:
    name: Publish
    needs: [ci-success]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false

      # Dry run first
      - name: Publish macro crate dry run
        run: cargo publish -p grafton-visca-macros --dry-run

      # Publish macro crate first
      - name: Publish grafton-visca-macros to crates.io
        run: cargo publish -p grafton-visca-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      # Wait for crates.io indexing
      - name: Wait for crates.io indexing
        run: sleep 30

      # Publish main crate
      - name: Publish grafton-visca to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
