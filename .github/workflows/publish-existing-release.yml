name: Publish Existing Release Tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish or retry
        required: true
        type: string

concurrency:
  group: publish-existing-release-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  # Needed by the "Verify CI passed on the tagged commit" gate below.
  checks: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Action refs and the toolchain are pinned to exactly what `ci.yml`
      # pins (see its "Toolchain pinning policy" comment). Publication must
      # package with the same compiler the release gates ran under, and a
      # floating `@stable` would silently change that between the tag being
      # validated and the tag being published.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag }}

      # RELEASING.md requires a tag whose commit passed every required CI job.
      # That was an honour-system instruction; this step makes it a gate. It
      # asks the API for the tagged commit's `CI success` check run — the
      # aggregate job `ci.yml` uses as the required check — and refuses to
      # publish unless it concluded successfully. `check_name` keeps the
      # response to that one run, so no pagination is involved.
      - name: Verify CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh api \
            --method GET \
            "repos/${REPOSITORY}/commits/${sha}/check-runs" \
            -f check_name='CI success' \
            --jq '[.check_runs[] | select(.status == "completed") | .conclusion] | first // "missing"')"
          echo "CI success check run for ${sha}: ${conclusion}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::refusing to publish ${sha}: its 'CI success' check run is '${conclusion}', not 'success'"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: "rust-cache-ubuntu-latest-stable"
          save-if: false

      - name: Validate release metadata and inspect payloads
        id: release
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          HARDWARE_CHECKLIST: docs/hardware_release_checklist.md
          RUSTC_WRAPPER: ""
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
          bash .github/scripts/validate-release.sh "$RELEASE_TAG"
          # Cargo.lock is intentionally ignored by this library workspace.
          # Generate the checkout-local lockfile only for reproducible locked
          # package/publish commands below.
          cargo generate-lockfile
          cargo package -p grafton-visca-macros --locked --no-verify
          cargo package -p grafton-visca-macros --list
          cargo package -p grafton-visca --list

      - name: Publish grafton-visca-macros if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RUSTC_WRAPPER: ""
        run: |
          if cargo info --registry crates-io "grafton-visca-macros@${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "grafton-visca-macros@${RELEASE_VERSION} is already published"
          else
            cargo publish -p grafton-visca-macros --locked --dry-run
            cargo publish -p grafton-visca-macros --locked
          fi

      - name: Wait for the macro crate index entry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh grafton-visca-macros "$RELEASE_VERSION" 300

      - name: Publish grafton-visca if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RUSTC_WRAPPER: ""
        run: |
          if cargo info --registry crates-io "grafton-visca@${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "grafton-visca@${RELEASE_VERSION} is already published"
          else
            cargo package -p grafton-visca --locked --no-verify
            cargo publish -p grafton-visca --locked --dry-run
            cargo publish -p grafton-visca --locked
          fi

      - name: Verify both published versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh grafton-visca-macros "$RELEASE_VERSION" 300
          bash .github/scripts/wait-for-crate.sh grafton-visca "$RELEASE_VERSION" 300
